[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Build context is the repo root so COPY can reach packages/ and apps/api/
buildContext = "."

[deploy]
# Liveness only. /health/ready pings DB+Redis and returns 503 when
# degraded — using it as Railway's only probe made deploys fail (or
# hang forever on a Redis offline-queue ping).
# healthcheckTimeout is measured from container start (migrate.js
# runs before listen), not per HTTP request — keep it generous.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Build context is the repo root so COPY can reach packages/ and apps/api/
buildContext = "."

[deploy]
# Liveness only. /health/ready pings DB+Redis and returns 503 when
# degraded — using it as Railway's only probe made deploys fail (or
# hang forever on a Redis offline-queue ping) and the hostname then
# served Railway's "Application not found" 404.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
